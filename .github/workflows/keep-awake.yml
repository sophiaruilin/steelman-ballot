# Render's free plan sleeps after ~15 minutes with no traffic, and the next visitor waits 30-60 seconds.
# This pings the health check every 10 minutes so the site stays awake. It reads nothing and stores
# nothing, does not count as a visit in /stats, and uses no AI tokens.
# One always-on free service uses about 744 of Render's 750 free hours in a 31-day month.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://steelman-ballot.onrender.com/api/health; then exit 0; fi
            sleep 10
          done
          echo "Site did not respond after 3 tries" && exit 1
